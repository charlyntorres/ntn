<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Weekday & Date Widget</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: fit-content;
    height: fit-content;
    background: transparent;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  .widget {
    display: inline-flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 8px 18px;
    text-align: center;
    line-height: 1.2;
    white-space: nowrap;
  }
  .weekday {
    font-size: 30px;
    font-weight: 700;
    letter-spacing: 0.4px;
    color: #000000;
  }
  .date {
    font-size: 16px;
    font-weight: 600;
    color: #6b6b6b;
    text-transform: uppercase;
    letter-spacing: 1.6px;
    margin-top: 3px;
  }

  @media (prefers-color-scheme: dark) {
    .weekday { color: #f5f5f5; }
    .date { color: #9a9aa5; }
  }
</style>
</head>
<body>
  <div class="widget">
    <div class="weekday" id="weekday"></div>
    <div class="date" id="date"></div>
  </div>

  <script>
    function updateClock() {
      const now = new Date();
      const weekdayOptions = { weekday: 'long' };
      const dateOptions = { year: 'numeric', month: 'long', day: 'numeric' };
      document.getElementById('weekday').textContent = now.toLocaleDateString(undefined, weekdayOptions);
      document.getElementById('date').textContent = now.toLocaleDateString(undefined, dateOptions);
    }
    updateClock();
    setInterval(updateClock, 1000 * 30); // refresh every 30s, no need for per-second since it's just date/weekday
  </script>
</body>
</html>
