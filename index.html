<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Weekday & Date Widget</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    background: transparent;
  }

  .widget {
    display: inline-flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 12px 20px;
    text-align: center;
    white-space: nowrap;
    background: transparent;
    position: relative;
    z-index: 1;
  }

  .toprow {
    display: flex;
    flex-direction: row;
    align-items: center;
    justify-content: center;
    gap: 36px;
  }

  .left, .right {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    line-height: 1.25;
    width: 200px;
  }

  .vdivider {
    width: 2px;
    align-self: stretch;
    margin: 4px 0;
    border-radius: 2px;
    background: linear-gradient(180deg, transparent, #e4e2db, transparent);
  }

  .icon {
    width: 26px;
    height: 26px;
    margin-bottom: 8px;
    color: #c9a876;
  }

  .weekday {
    font-size: 44px;
    font-weight: 700;
    letter-spacing: 0.4px;
    color: #1a1a1a;
  }

  .divider {
    align-self: stretch;
    height: 1px;
    background: linear-gradient(90deg, transparent, #e4e2db, transparent);
    margin: 20px 0;
  }

  .date {
    font-size: 24px;
    font-weight: 600;
    color: #8a8a92;
    text-transform: uppercase;
    letter-spacing: 2px;
    text-align: center;
  }

  .clock {
    font-size: 44px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.4px;
    color: #1a1a1a;
    font-family: "SF Mono", "Consolas", "Menlo", monospace;
  }

  @media (prefers-color-scheme: dark) {
    .vdivider { background: linear-gradient(180deg, transparent, #35363c, transparent); }
    .divider { background: linear-gradient(90deg, transparent, #35363c, transparent); }
    .icon { color: #d8b98a; }
    .weekday { color: #f5f5f5; }
    .date { color: #9a9aa5; }
    .clock { color: #f5f5f5; }
  }
</style>
</head>
<body>
  <div class="widget">
    <div class="toprow">
      <div class="left">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="4.5" width="18" height="16" rx="3"></rect>
          <line x1="3" y1="9.5" x2="21" y2="9.5"></line>
          <line x1="8" y1="2.5" x2="8" y2="6.5"></line>
          <line x1="16" y1="2.5" x2="16" y2="6.5"></line>
        </svg>
        <div class="weekday" id="weekday"></div>
      </div>
      <div class="vdivider"></div>
      <div class="right">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="9"></circle>
          <polyline points="12 7 12 12 15.5 14"></polyline>
        </svg>
        <div class="clock" id="clock"></div>
      </div>
    </div>
    <div class="divider"></div>
    <div class="date" id="date"></div>
  </div>

  <script>
    function updateClock() {
      const now = new Date();
      const weekdayOptions = { weekday: 'long' };
      const monthNames = ['January','February','March','April','May','June','July','August','September','October','November','December'];
      document.getElementById('weekday').textContent = now.toLocaleDateString(undefined, weekdayOptions);
      document.getElementById('date').textContent = `${now.getDate()} ${monthNames[now.getMonth()]} ${now.getFullYear()}`;

      const hours = now.getHours().toString().padStart(2, '0');
      const minutes = now.getMinutes().toString().padStart(2, '0');
      document.getElementById('clock').textContent = `${hours}:${minutes}`;
    }
    updateClock();
    setInterval(updateClock, 1000 * 15); // check every 15s so the minute updates promptly
  </script>
</body>
</html>
